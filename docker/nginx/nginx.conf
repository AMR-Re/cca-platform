# Reverse proxy for the CCA Platform.
#
# Routes:
#   /api/*  -> NestJS API service ("api" container, port 4000)
#   /*      -> Next.js web app ("web" container, port 3000)
#
# This file is deployment-ready but deliberately contains no certificates,
# secrets, or hard-coded production domains. To serve over HTTPS, terminate
# TLS here (add a `listen 443 ssl;` server block with your cert/key paths,
# typically injected via a mounted volume or a tool like certbot) or
# terminate TLS at a layer in front of this proxy (e.g. a cloud load
# balancer) and keep this config HTTP-only behind it.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Docker's embedded DNS resolves service names; re-resolving here lets
  # nginx pick up container restarts instead of caching a dead IP forever.
  resolver 127.0.0.11 valid=30s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # Real IP / proto forwarding so the API and web app see the original
    # client address and scheme when TLS is terminated in front of nginx.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 10m;

    location /api/ {
      set $api_upstream api:4000;
      proxy_pass http://$api_upstream;
    }

    location / {
      set $web_upstream web:3000;
      proxy_pass http://$web_upstream;

      # Next.js dev/HMR and any future websocket usage.
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
