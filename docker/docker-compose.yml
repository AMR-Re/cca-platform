name: cca-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: cca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cca_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cca_password}
      POSTGRES_DB: ${POSTGRES_DB:-cca_platform}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cca_user} -d ${POSTGRES_DB:-cca_platform}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cca-network

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: cca-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cca_user}:${POSTGRES_PASSWORD:-cca_password}@postgres:5432/${POSTGRES_DB:-cca_platform}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4000/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cca-network

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    container_name: cca-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/en', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cca-network

  # Optional reverse proxy - not started by default local `docker compose up`.
  # Enable with: docker compose --profile with-nginx up
  nginx:
    image: nginx:1.27-alpine
    container_name: cca-nginx
    restart: unless-stopped
    profiles: ['with-nginx']
    depends_on:
      - api
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '${NGINX_PORT:-8080}:80'
    networks:
      - cca-network

networks:
  cca-network:
    driver: bridge

volumes:
  postgres_data:
